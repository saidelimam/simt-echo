[versions]
agp = "9.5.1"
android-compileSdk = "37"
android-minSdk = "29"
android-targetSdk = "36"

androidx-activityCompose = "1.13.0"
androidx-lifecycle = "2.11.0"
litertlm = "0.19.1"
androidx-navigationCompose = "2.10.0"
compose-multiplatform = "1.12.2"
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
# Multiplatform lock: commonMain capture code holds a real monitor on JVM
# and a platform lock on native (`synchronized` is JVM-only).
kotlinx-atomicfu = "0.33.0"
kotlinx-serialization = "1.12.0"
okio = "3.18.2"
ktor = "3.6.1"
cryptography = "0.6.0"
camerax = "1.6.2"
media3 = "1.11.1"
qrose = "1.3.1"
zxing = "3.5.4"
mlkit-barcode = "17.3.0"
mlkit-face = "16.1.7"
play-services-wearable = "20.0.1"
# W10-04 perf harness: macrobenchmark + Baseline Profile + JankStats.
benchmark = "1.5.0"
baselineprofile = "1.5.0"
profileinstaller = "1.4.1"
metrics-performance = "1.0.0"
uiautomator = "2.4.1"
test-ext-junit = "1.3.0"
test-runner = "1.7.0"
junit4 = "4.13.2"
# W6-03 headless UI gate: Robolectric runs androidMain composables on the
# host JVM. SDK pin lags compileSdk per review 0006 NR-2 (no SDK-37
# shadows yet) — UI tests run @Config(sdk = [36]).
robolectric = "4.17"

[libraries]
# AndroidX
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activityCompose" }
# W2-07 FileProvider for the `.echo` share sheet.
androidx-core = { group = "androidx.core", name = "core-ktx", version = "1.17.0" }
litertlm-android = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "androidx-navigationCompose" }

# Coroutines / serialization
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-atomicfu = { group = "org.jetbrains.kotlinx", name = "atomicfu", version.ref = "kotlinx-atomicfu" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Files
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
okio-fakefilesystem = { group = "com.squareup.okio", name = "okio-fakefilesystem", version.ref = "okio" }

# HTTP
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }

# Crypto
cryptography-core = { group = "dev.whyoleg.cryptography", name = "cryptography-core", version.ref = "cryptography" }
cryptography-provider-optimal = { group = "dev.whyoleg.cryptography", name = "cryptography-provider-optimal", version.ref = "cryptography" }

# QR
qrose = { group = "io.github.alexzhirkevich", name = "qrose", version.ref = "qrose" }
# Test-only QR decoder: proves the sigil logo never costs a scan (W13-07).
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkit-barcode" }
# W11-04 privacy pre-filter: bundled model (works offline, no Play Services download).
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkit-face" }

# Camera / video
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-video = { group = "androidx.camera", name = "camera-video", version.ref = "camerax" }
camerax-compose = { group = "androidx.camera", name = "camera-compose", version.ref = "camerax" }
media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
media3-extractor = { group = "androidx.media3", name = "media3-extractor", version.ref = "media3" }

# Wear OS (W5-04 haptic mirror: MessageClient + CapabilityClient only)
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "play-services-wearable" }

# W10-04 perf harness (macrobenchmarks run on device; see docs/perf.md).
benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
metrics-performance = { group = "androidx.metrics", name = "metrics-performance", version.ref = "metrics-performance" }
test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "test-ext-junit" }
test-runner = { group = "androidx.test", name = "runner", version.ref = "test-runner" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

# Unit tests
junit-junit = { group = "junit", name = "junit", version.ref = "junit4" }

# Headless UI gate (W6-03/W7-02): Robolectric + Compose test rule for the
# androidHostTest source set. ui-test-junit4 tracks the CMP plugin version.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { group = "org.jetbrains.compose.ui", name = "ui-test-junit4", version.ref = "compose-multiplatform" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
# No version: bundled with AGP on the classpath (see root build.gradle.kts).
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# W10-04 perf harness: :benchmark is a com.android.test module with the
# Baseline Profile plugin; the app consumes its output (see docs/perf.md).
# No version: bundled with AGP on the classpath (see root build.gradle.kts).
androidTest = { id = "com.android.test" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
